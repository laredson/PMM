name: Refresh v1.3.4.1 release from green main

on:
  push:
    branches: [release/v1.3.4.1-main-assets]
    paths: [.github/workflows/v1341-main-release-once.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout exact green main commit
        uses: actions/checkout@v4
        with:
          ref: 70d106e871099e4936dc5f81eef3e4ea15529d93
          fetch-depth: 0

      - name: Confirm release commit is current main
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin main
          $head=(git rev-parse HEAD).Trim()
          $main=(git rev-parse origin/main).Trim()
          if($head -ne $main){throw "main moved after validation: expected $head, current $main"}

      - name: Revalidate current package contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./Development/Scripts/validation/Validate-v1.3.ps1 -Quiet
          python Development/Localization/audit_localization.py
          ./Development/Localization/Test-Localization.ps1 -Language zh-CN

      - name: Windows PowerShell 5.1 localization regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-ExecutionPolicy -Scope Process Bypass -Force
          ./Development/Localization/Test-PowerShell51.ps1 -Language zh-CN

      - name: Package exact main state
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path PMM/* -DestinationPath PMM-1.3.4.1.zip -CompressionLevel Optimal
          $hash=(Get-FileHash PMM-1.3.4.1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PMM-1.3.4.1.zip"|Set-Content PMM-1.3.4.1.zip.sha256 -Encoding ascii
          $sha=(git rev-parse HEAD).Trim()
          $validation=[ordered]@{
            version='1.3.4.1'
            release='Chinese translation + green main CI refresh'
            language='zh-CN'
            languageName='简体中文'
            commit=$sha
            branch='main'
            sha256=$hash
            catalogStrings=1291
            discoveredUiStrings=1278
            relevantUiStrings=1232
            nativeLanguageNames=@('English','Español','简体中文')
            checks=@(
              'main CI completed successfully',
              'current package validator passed',
              'Windows PowerShell 5.1 localization passed',
              '1291 zh-CN catalog strings validated',
              'WPF/XAML validation passed in main CI',
              'Host and Runtime tests passed in main CI',
              'native runtime and host-to-runtime self-tests passed in main CI',
              'Desktop/workspace regression suite passed in main CI'
            )
          }
          $validation|ConvertTo-Json -Depth 5|Set-Content PMM-1.3.4.1.validation.json -Encoding utf8
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT,"sha=$sha`nhash=$hash`n",[Text.Encoding]::UTF8)

      - name: Replace existing v1.3.4.1 assets and retarget tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $sha='${{ steps.package.outputs.sha }}'
          git tag -f v1.3.4.1 $sha
          git push origin refs/tags/v1.3.4.1 --force
          @'
          ## v1.3.4.1 Chinese translation

          In-place refresh of the existing v1.3.4.1 release from the validated `main` branch.

          - Adds Simplified Chinese (`简体中文`, `zh-CN`) while preserving English and Spanish.
          - Language selectors always use each language's native name: `English`, `Español`, `简体中文`.
          - The localization layer and shipped UI are validated under Windows PowerShell 5.1.
          - CI now validates the current release contract instead of historical 1.3.1/RC-only assumptions.
          - Package integrity, XAML/WPF, Host, Runtime, native self-tests and Desktop/workspace regressions are green on `main`.
          - This is the same v1.3.4.1 release; no new version or release was created.
          '@|Set-Content release-notes.md -Encoding utf8
          gh release upload v1.3.4.1 PMM-1.3.4.1.zip PMM-1.3.4.1.zip.sha256 PMM-1.3.4.1.validation.json --clobber
          gh release edit v1.3.4.1 --title 'v1.3.4.1 Chinese translation' --notes-file release-notes.md --target $sha --latest
