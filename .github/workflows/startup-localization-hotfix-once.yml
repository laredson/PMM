name: Hotfix PMM v1.3.4.1 startup localization

on:
  push:
    branches: [1.3.4.1]
    paths: [.github/workflows/startup-localization-hotfix-once.yml]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove risky live localization hook
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $start='PMM/Modules/Bootstrap/Start-PalModMerger.ps1'
          $text=Get-Content -LiteralPath $start -Raw -Encoding UTF8
          $old='Register-PMMLiveLocalization $Window $lang'
          $new="try{Invoke-PMMLocalizeVisualTree `$Window `$lang;Set-PMMLanguageDirection `$Window `$lang}catch{Write-PMMLog ('Startup localization sweep failed: '+`$_.Exception.Message)}"
          if(-not $text.Contains($old)){throw 'Expected live-localization startup call not found'}
          $text=$text.Replace($old,$new)
          [IO.File]::WriteAllText((Resolve-Path $start),$text,[Text.UTF8Encoding]::new($true))

          $loc='PMM/Modules/Shared/Localization.ps1'
          $locText=Get-Content -LiteralPath $loc -Raw -Encoding UTF8
          $marker='$Script:PMMLiveLocalizationHandler=$null'
          $at=$locText.IndexOf($marker,[StringComparison]::Ordinal)
          if($at -lt 0){throw 'Live localization helper marker not found'}
          $locText=$locText.Substring(0,$at).TrimEnd()+[Environment]::NewLine
          [IO.File]::WriteAllText((Resolve-Path $loc),$locText,[Text.UTF8Encoding]::new($true))

      - name: Audit localization
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python Development/Localization/audit_localization.py
          & ./Development/Localization/Test-Localization.ps1 -Language zh-CN

      - name: Parse PowerShell and XAML
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $failed=$false
          Get-ChildItem PMM/Modules -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$failed=$true;$errors|ForEach-Object{Write-Error ($_.Extent.File+': '+$_.Message)}}
          }
          if($failed){throw 'PowerShell parse validation failed'}
          Get-ChildItem PMM/Resources/UI -Filter *.xaml | ForEach-Object {[xml](Get-Content $_.FullName -Raw -Encoding UTF8)|Out-Null}

      - name: WPF localization startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase
          $Script:Root=(Resolve-Path 'PMM').Path
          . (Join-Path $Script:Root 'Modules/Shared/Localization.ps1')
          if((Resolve-PMMLanguageCode 'zh-CN') -cne 'zh-CN'){throw 'Language resolver failed'}
          [xml]$xml=Get-Content PMM/Resources/UI/MainWindow.zh-CN.xaml -Raw -Encoding UTF8
          $reader=[System.Xml.XmlNodeReader]::new($xml)
          $window=[Windows.Markup.XamlReader]::Load($reader)
          Invoke-PMMLocalizeVisualTree $window 'zh-CN'
          Set-PMMLanguageDirection $window 'zh-CN'
          if(-not $window){throw 'Chinese WPF window did not load'}
          $window.Close()
          $startup=Get-Content PMM/Modules/Bootstrap/Start-PalModMerger.ps1 -Raw -Encoding UTF8
          if($startup -match 'Register-PMMLiveLocalization'){throw 'Risky live hook remains in startup'}

      - name: Commit hotfix
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item .github/workflows/startup-localization-hotfix-once.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PMM Development/Localization .github/workflows
          git commit -m 'fix: avoid live localization hook during PMM startup'
          git push origin HEAD:1.3.4.1
          $sha=(git rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Package corrected v1.3.4.1
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path PMM/* -DestinationPath PMM-1.3.4.1.zip -CompressionLevel Optimal
          $hash=(Get-FileHash PMM-1.3.4.1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PMM-1.3.4.1.zip"|Set-Content PMM-1.3.4.1.zip.sha256 -Encoding ascii
          $audit=Get-Content Development/Localization/LAST_AUDIT.json -Raw|ConvertFrom-Json
          $validation=[ordered]@{
            version='1.3.4.1'; release='Chinese translation + startup hotfix'; language='zh-CN'; languageName='简体中文';
            commit='${{ steps.commit.outputs.sha }}'; sha256=$hash;
            catalogStrings=$audit.chineseCatalogStrings; discoveredUiStrings=$audit.discoveredUiStrings;
            checks=@('localization audit passed','PowerShell parsed','XAML parsed','Chinese WPF loaded','startup live-hook regression removed')
          }
          $validation|ConvertTo-Json -Depth 5|Set-Content PMM-1.3.4.1.validation.json -Encoding utf8

      - name: Replace same v1.3.4.1 release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $sha='${{ steps.commit.outputs.sha }}'
          git tag -f v1.3.4.1 $sha
          git push origin refs/tags/v1.3.4.1 --force
          @'
          ## v1.3.4.1 Chinese translation — startup hotfix

          In-place refresh of the existing v1.3.4.1 release.

          - Keeps the complete Simplified Chinese catalog/localization architecture.
          - Fixes a startup regression introduced by the global live-localization event hook.
          - Dynamic workspaces are localized during their normal initialization, followed by a safe one-time whole-window localization sweep.
          - No new version or release was created.
          '@|Set-Content release-notes.md -Encoding utf8
          gh release upload v1.3.4.1 PMM-1.3.4.1.zip PMM-1.3.4.1.zip.sha256 PMM-1.3.4.1.validation.json --clobber
          gh release edit v1.3.4.1 --title 'v1.3.4.1 Chinese translation' --notes-file release-notes.md --target $sha --latest
