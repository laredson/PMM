name: PMM localization inventory once

on:
  push:
    branches: [1.3.4.1]
    paths: [.github/workflows/localization-inventory-once.yml]

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build missing-string inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import ast, html, json, re

          catalog_path=Path('PMM/Resources/UI/strings.zh-CN.json')
          catalog=json.loads(catalog_path.read_text(encoding='utf-8-sig')) if catalog_path.exists() else {}
          found={}
          def add(s,p,line,kind):
              s=html.unescape(s).strip()
              if not s or s.startswith('{') or s in ('*','-'): return
              found.setdefault(s,[]).append({'path':str(p),'line':line,'kind':kind})

          # English first argument of L/Get-PMMText, including most dynamic UI/status messages.
          pair_patterns=[
              re.compile(r"\bL\s+'((?:''|[^'])*)'\s+'((?:''|[^'])*)'"),
              re.compile(r"\bGet-PMMText\s+'((?:''|[^'])*)'\s+'((?:''|[^'])*)'")
          ]
          for p in Path('PMM/Modules').rglob('*.ps1'):
              text=p.read_text(encoding='utf-8-sig',errors='ignore')
              for ln,line in enumerate(text.splitlines(),1):
                  for pat in pair_patterns:
                      for m in pat.finditer(line): add(m.group(1).replace("''", "'"),p,ln,'localized-pair')

          # XAML attributes in English source and embedded XAML in PowerShell.
          attr=re.compile(r'\b(Text|Content|Header|ToolTip)="([^"]+)"')
          xaml_files=[Path('PMM/Resources/UI/MainWindow.en.xaml')]
          for p in xaml_files:
              if p.exists():
                  text=p.read_text(encoding='utf-8-sig',errors='ignore')
                  for ln,line in enumerate(text.splitlines(),1):
                      for m in attr.finditer(line): add(m.group(2),p,ln,'xaml')
          for p in Path('PMM/Modules').rglob('*.ps1'):
              text=p.read_text(encoding='utf-8-sig',errors='ignore')
              for ln,line in enumerate(text.splitlines(),1):
                  if '<' in line and '>' in line:
                      for m in attr.finditer(line): add(m.group(2),p,ln,'embedded-xaml')

          # Direct WPF assignments not wrapped in L/Get-PMMText.
          direct=re.compile(r'\.(Text|Content|Header|ToolTip)\s*=\s*[\'\"]([^\'\"]{2,})[\'\"]')
          for p in Path('PMM/Modules').rglob('*.ps1'):
              text=p.read_text(encoding='utf-8-sig',errors='ignore')
              for ln,line in enumerate(text.splitlines(),1):
                  if '(L ' in line or 'Get-PMMText' in line: continue
                  for m in direct.finditer(line): add(m.group(2),p,ln,'direct-wpf')

          # UI label object literals and settings/tab specs.
          label_patterns=[
              re.compile(r"\b(?:Label|Display|Header)\s*=\s*'([^']{2,})'"),
              re.compile(r"@\('(?:General|AI|Installs|Mods|ModCreation|Help)'\s*,\s*'([^']{2,})'\)")
          ]
          for p in Path('PMM/Modules').rglob('*.ps1'):
              text=p.read_text(encoding='utf-8-sig',errors='ignore')
              for ln,line in enumerate(text.splitlines(),1):
                  for pat in label_patterns:
                      for m in pat.finditer(line): add(m.group(1),p,ln,'ui-label')

          # Remove obvious technical/binding-only values.
          ignore_exact={'AUTO','OK','PASS','FAIL','PARTIAL','MCP','ZIP','PAK','JSON','MB','SHA-256','ChatGPT','Codex','Palworld','PMM','Wwise','Unreal','Steam','Windows','Visual Studio','Epic Launcher'}
          def looks_ui(s):
              if s in ignore_exact: return False
              if s.startswith('PMM_') or '\\' in s or s.startswith('http'): return False
              if re.fullmatch(r'[A-Za-z0-9_.:/+-]+',s) and not (' ' in s):
                  # keep ordinary one-word UI labels but discard identifiers/extensions.
                  if any(ch in s for ch in '._/:\\'): return False
              return any(c.isalpha() for c in s)
          missing={k:v for k,v in sorted(found.items(),key=lambda kv:kv[0].lower()) if looks_ui(k) and k not in catalog}
          out=Path('Development/Localization');out.mkdir(parents=True,exist_ok=True)
          payload={'catalogCount':len(catalog),'discoveredCount':len(found),'missingCount':len(missing),'missing':missing}
          (out/'MISSING_ZH_CN.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:payload[k] for k in ('catalogCount','discoveredCount','missingCount')}))
          PY
      - name: Commit inventory and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/localization-inventory-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Development/Localization/MISSING_ZH_CN.json .github/workflows/localization-inventory-once.yml
          git commit -m 'chore: inventory missing Chinese UI strings'
          git push origin HEAD:1.3.4.1
