name: PMM Chinese Release Once

on:
  push:
    branches:
      - v1.3.4.1-Chinese-translation
    paths:
      - .github/workflows/chinese-release-once.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync release branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v1.3.4.1-Chinese-translation
          git checkout v1.3.4.1-Chinese-translation
          git reset --hard origin/v1.3.4.1-Chinese-translation

