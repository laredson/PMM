          root = Path("PMM")
          ui = root / "Resources" / "UI"
          ui.mkdir(parents=True, exist_ok=True)
          (ui / "strings.zh-CN.json").write_text(json.dumps(T, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          src_path = ui / "MainWindow.en.xaml"
          raw = src_path.read_bytes()
          source = raw.decode("utf-8-sig")
          attr = re.compile(r'(?P<prefix>\b(?:Text|Content|Header|ToolTip)=")(?P<value>[^"]*)(?P<suffix>")')
          translated = 0
          def repl(m):
              global translated
              original = html.unescape(m.group("value"))
              value = T.get(original)
              if value is None:
                  return m.group(0)
              translated += 1
              return m.group("prefix") + html.escape(value, quote=True) + m.group("suffix")
          zh = attr.sub(repl, source)
          if translated < 120:
              raise SystemExit(f"Translation coverage unexpectedly low: {translated}")
          out = ui / "MainWindow.zh-CN.xaml"
          out.write_bytes(b"\xef\xbb\xbf" + zh.encode("utf-8"))

          loc = root / "Modules" / "Shared" / "Localization.zh-CN.ps1"
          loc.write_text("""$Script:PMMChineseStrings = $null
          function Get-PMMChineseText([string]$English) {
            if ([string]::IsNullOrWhiteSpace($English)) { return $English }
            if ($null -eq $Script:PMMChineseStrings) {
              $Script:PMMChineseStrings = @{}
              try {
                $path = Join-Path $Script:Root 'Resources\\UI\\strings.zh-CN.json'
                if (Test-Path -LiteralPath $path -PathType Leaf) {
                  $obj = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
                  foreach ($prop in $obj.PSObject.Properties) { $Script:PMMChineseStrings[[string]$prop.Name] = [string]$prop.Value }
                }
              } catch {}
            }
            if ($Script:PMMChineseStrings.ContainsKey($English)) { return [string]$Script:PMMChineseStrings[$English] }
            return $English
          }
          """, encoding="utf-8-sig")

          def read_ps(path):
              data = path.read_bytes()
              return data.startswith(b"\xef\xbb\xbf"), data.decode("utf-8-sig")
          def write_ps(path, bom, text):
              path.write_bytes((b"\xef\xbb\xbf" if bom else b"") + text.encode("utf-8"))

          common_path = root / "Modules" / "Shared" / "Common.ps1"
          bom, common = read_ps(common_path)
          include = ". (Join-Path $PSScriptRoot 'Localization.zh-CN.ps1')"
          if include not in common:
              anchor = ". (Join-Path $PSScriptRoot 'LongPaths.ps1')"
              if anchor not in common:
                  raise SystemExit("Common.ps1 localization include anchor not found")
              nl = "\r\n" if "\r\n" in common else "\n"
              common = common.replace(anchor, anchor + nl + include, 1)
          nl = "\r\n" if "\r\n" in common else "\n"
          pattern = re.compile(r"function Get-PMMText\(\[string\]\$English,\[string\]\$Spanish\)\{\s*\$cfg=Get-PMMConfig\s*if\(\$cfg\.Language -eq 'es'\)\{return \$Spanish\}\s*return \$English\s*\}", re.S)
          replacement = nl.join([
              "function Get-PMMText([string]$English,[string]$Spanish){",
              "  $cfg=Get-PMMConfig",
              "  if($cfg.Language -eq 'es'){return $Spanish}",
              "  if($cfg.Language -eq 'zh-CN'){return Get-PMMChineseText $English}",
              "  return $English",
              "}"
          ])
          if "if($cfg.Language -eq 'zh-CN'){return Get-PMMChineseText $English}" not in common:
              common, n = pattern.subn(replacement, common, count=1)
              if n != 1:
                  raise SystemExit("Common.ps1 Get-PMMText anchor not found")
          write_ps(common_path, bom, common)

          start_path = root / "Modules" / "Bootstrap" / "Start-PalModMerger.ps1"
          bom, start = read_ps(start_path)
          old_lang = "$lang = if ($startupCfg.Language -eq 'es') { 'es' } else { 'en' }"
          new_lang = "$lang = if ($startupCfg.Language -eq 'es') { 'es' } elseif ($startupCfg.Language -eq 'zh-CN') { 'zh-CN' } else { 'en' }"
          if old_lang in start:
              start = start.replace(old_lang, new_lang, 1)
          elif new_lang not in start:
              raise SystemExit("Start-PalModMerger.ps1 startup language anchor not found")

          chinese_option = "  [pscustomobject]@{Label='简体中文';Code='zh-CN'}"
          if chinese_option not in start:
              spanish = "  [pscustomobject]@{Label='Español';Code='es'}"
              if spanish not in start:
                  raise SystemExit("Language options anchor not found")
              sep = ",\r\n" if "\r\n" in start else ",\n"
              start = start.replace(spanish, spanish + sep + chinese_option, 1)

          old_apply = "$cfg.Language = if ($selectedCode -eq 'es') { 'es' } else { 'en' }"
          new_apply = "$cfg.Language = if ($selectedCode -in @('es','zh-CN')) { $selectedCode } else { 'en' }"
          if old_apply in start:
              start = start.replace(old_apply, new_apply, 1)
          elif new_apply not in start:
              raise SystemExit("Apply language anchor not found")

          wrapper = "function L([string]$English,[string]$Spanish){ return Get-PMMText $English $Spanish }"
          if wrapper not in start:
              anchor = "Start-PMMLogSession 'UI'"
              if anchor not in start:
                  raise SystemExit("L localization wrapper anchor not found")
              nl = "\r\n" if "\r\n" in start else "\n"
              start = start.replace(anchor, wrapper + nl + anchor, 1)
          write_ps(start_path, bom, start)

          version = root / "Resources" / "Metadata" / "VERSION.txt"
          version.write_text("1.3.4.1\n", encoding="utf-8")
          print(f"Translated {translated} static XAML strings; dictionary has {len(T)} entries.")
          PY

      - name: Validate localization files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          xaml = Path('PMM/Resources/UI/MainWindow.zh-CN.xaml')
          ET.parse(xaml)
          text = xaml.read_text(encoding='utf-8-sig')
          for required in ('模组库','修复实验室','AI 与帮助','世界存档','设置'):
              if required not in text:
                  raise SystemExit(f'Missing Chinese UI marker: {required}')
          data=json.loads(Path('PMM/Resources/UI/strings.zh-CN.json').read_text(encoding='utf-8'))
          if len(data) < 150:
              raise SystemExit('Chinese translation dictionary is unexpectedly small')
          PY
          pwsh -NoProfile -Command '$files=@("PMM/Modules/Shared/Localization.zh-CN.ps1","PMM/Modules/Shared/Common.ps1","PMM/Modules/Bootstrap/Start-PalModMerger.ps1"); foreach($f in $files){$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_.Message};exit 1}}'

      - name: Commit final release state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/chinese-release-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PMM/Resources/UI/MainWindow.zh-CN.xaml PMM/Resources/UI/strings.zh-CN.json PMM/Modules/Shared/Localization.zh-CN.ps1 PMM/Modules/Shared/Common.ps1 PMM/Modules/Bootstrap/Start-PalModMerger.ps1 PMM/Resources/Metadata/VERSION.txt .github/workflows/chinese-release-once.yml
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add Simplified Chinese translation for v1.3.4.1'
            git push origin HEAD:v1.3.4.1-Chinese-translation
          fi

      - name: Package portable release
        shell: bash
        run: |
          set -euo pipefail
          rm -f PMM-1.3.4.1.zip PMM-1.3.4.1.zip.sha256 PMM-1.3.4.1.validation.json
          (cd PMM && zip -qr ../PMM-1.3.4.1.zip .)
          sha256sum PMM-1.3.4.1.zip > PMM-1.3.4.1.zip.sha256
          FINAL_SHA="$(git rev-parse HEAD)"
          SHA256="$(sha256sum PMM-1.3.4.1.zip | awk '{print $1}')"
          python3 - "$FINAL_SHA" "$SHA256" <<'PY'
          import json, sys
          out={"version":"1.3.4.1","release":"Chinese translation","language":"zh-CN","languageName":"简体中文","commit":sys.argv[1],"sha256":sys.argv[2],"validation":["Chinese XAML parsed successfully","PowerShell localization files parsed successfully","English and Spanish resources preserved"]}
          open('PMM-1.3.4.1.validation.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="$(git rev-parse HEAD)"
          cat > release-notes.md <<'EOF'
          ## v1.3.4.1 Chinese translation

          - Añade **简体中文 (zh-CN)** a PMM desde **Settings > Language**.
          - Traduce la interfaz principal, Mods & Merge, Fix Lab, AI & Help, World Save, Settings y los textos dinámicos cubiertos por el sistema de localización.
          - Mantiene intactos English y Español y usa inglés como fallback para cualquier texto aún no localizado.
          - Actualiza la versión interna a **1.3.4.1**.

          **中文：** PMM 现在支持简体中文。可在 **设置 > 语言** 中选择 **简体中文**；英语和西班牙语保持不变。
          EOF
          if gh release view v1.3.4.1 >/dev/null 2>&1; then
            gh release edit v1.3.4.1 --title 'v1.3.4.1 Chinese translation' --notes-file release-notes.md --latest
          else
            gh release create v1.3.4.1 PMM-1.3.4.1.zip PMM-1.3.4.1.zip.sha256 PMM-1.3.4.1.validation.json --target "$FINAL_SHA" --title 'v1.3.4.1 Chinese translation' --notes-file release-notes.md --latest
          fi
