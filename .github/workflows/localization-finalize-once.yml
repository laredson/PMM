name: Finalize PMM v1.3.4.1 localization

on:
  push:
    branches:
      - 1.3.4.1
    paths:
      - .github/workflows/localization-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final localization hardening
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import json

          root=Path('PMM')
          loc=root/'Resources/Localization'
          for code, values in {
              'en': {
                  'QUEUED':'QUEUED','RUNNING':'RUNNING','WAITING_EXTERNAL':'WAITING_EXTERNAL','AWAITING_CONSENT':'AWAITING_CONSENT','COMPLETE':'COMPLETE','FAILED':'FAILED','CANCELLED':'CANCELLED'
              },
              'es': {
                  'QUEUED':'EN COLA','RUNNING':'EN EJECUCIÓN','WAITING_EXTERNAL':'ESPERANDO ACCIÓN EXTERNA','AWAITING_CONSENT':'ESPERANDO CONFIRMACIÓN','COMPLETE':'COMPLETADO','FAILED':'FALLIDO','CANCELLED':'CANCELADO'
              },
              'zh-CN': {
                  'QUEUED':'排队中','RUNNING':'运行中','WAITING_EXTERNAL':'等待外部操作','AWAITING_CONSENT':'等待确认','COMPLETE':'已完成','FAILED':'失败','CANCELLED':'已取消'
              }
          }.items():
              path=loc/f'{code}.json'
              doc=json.loads(path.read_text(encoding='utf-8-sig'))
              doc['strings'].update(values)
              doc['strings']=dict(sorted(doc['strings'].items(), key=lambda kv: kv[0].lower()))
              path.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          zh=json.loads((loc/'zh-CN.json').read_text(encoding='utf-8'))['strings']
          (root/'Resources/UI/strings.zh-CN.json').write_text(json.dumps(zh,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          dep=root/'Modules/Unreal/Dependencies.UI.ps1'
          t=dep.read_text(encoding='utf-8-sig')
          old="$names=@(Get-PMMDependencyDefinitions|Where-Object{($Job.component -eq 'all' -and $_.id -ne 'chatgpt') -or $_.id -eq $Job.component}|ForEach-Object{$_.name+' '+$_.version})"
          new="$names=@(Get-PMMDependencyDefinitions|Where-Object{($Job.component -eq 'all' -and $_.id -ne 'chatgpt') -or $_.id -eq $Job.component}|ForEach-Object{(Get-PMMLocalizedText ([string]$_.name))+' '+(Get-PMMLocalizedText ([string]$_.version))})"
          if new not in t:
              if old not in t: raise SystemExit('Dependency consent label anchor missing')
              t=t.replace(old,new,1)
          old2="$Script:PMMDependencySelectedJob=$job.id;$Script:PMMDependencyStatus.Text=$job.status}catch{Handle-UIError $_ 'Dependencies'}"
          new2="$Script:PMMDependencySelectedJob=$job.id;$Script:PMMDependencyStatus.Text=Get-PMMLocalizedText ([string]$job.status)}catch{Handle-UIError $_ 'Dependencies'}"
          if new2 not in t:
              if old2 not in t: raise SystemExit('Dependency immediate status anchor missing')
              t=t.replace(old2,new2,1)
          dep.write_text(t,encoding='utf-8-sig')

          # ComboBox/ListBox data objects often expose Label through DisplayMemberPath. Localize that data too.
          snippet="""    if($Root -is [Windows.Controls.ItemsControl] -and $Root.ItemsSource){foreach($item in @($Root.ItemsSource)){try{if($item -and ($item.PSObject.Properties.Name -contains 'Label') -and $item.Label -is [string]){$item.Label=Get-PMMLocalizedText ([string]$item.Label) $code}}catch{}}}\n"""
          anchor="    if($Root -is [Windows.Controls.DataGrid]){foreach($column in @($Root.Columns)){if($column.Header -is [string]){$column.Header=Get-PMMLocalizedText ([string]$column.Header) $code}}}\n"
          for path in [root/'Modules/Shared/Localization.ps1',Path('Development/Localization/build_localization.py')]:
              text=path.read_text(encoding='utf-8-sig')
              if snippet.strip() not in text:
                  if anchor not in text: raise SystemExit(f'ItemsControl localization anchor missing in {path}')
                  text=text.replace(anchor,snippet+anchor,1)
                  path.write_text(text,encoding='utf-8-sig' if path.suffix=='.ps1' else 'utf-8')
          '@ | python -

      - name: Audit every catalogued UI surface
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python Development/Localization/audit_localization.py
          & ./Development/Localization/Test-Localization.ps1 -Language zh-CN

      - name: Parse all PowerShell and XAML
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $failed=$false
          Get-ChildItem PMM/Modules -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$failed=$true;$errors|ForEach-Object{Write-Error ($_.Extent.File+': '+$_.Message)}}
          }
          if($failed){throw 'PowerShell parse validation failed'}
          Get-ChildItem PMM/Resources/UI -Filter *.xaml | ForEach-Object {[xml](Get-Content $_.FullName -Raw -Encoding UTF8)|Out-Null}

      - name: WPF localization smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase
          $Script:Root=(Resolve-Path 'PMM').Path
          . (Join-Path $Script:Root 'Modules/Shared/Localization.ps1')
          if((Get-PMMLocalizedText 'Projects' 'zh-CN') -cne '项目'){throw 'Chinese catalog lookup failed'}
          if((Get-PMMLocalizedText 'Installations and status' 'zh-CN') -cne '安装与状态'){throw 'Installations translation lookup failed'}
          $probe='<StackPanel xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"><TextBlock Text="Projects"/><Button Content="New case"/></StackPanel>'
          $localized=Convert-PMMXamlLocalization $probe 'zh-CN'
          if($localized -notmatch '项目'){throw 'Embedded XAML localization failed'}
          [xml]$xml=Get-Content PMM/Resources/UI/MainWindow.zh-CN.xaml -Raw -Encoding UTF8
          $reader=[System.Xml.XmlNodeReader]::new($xml)
          $window=[Windows.Markup.XamlReader]::Load($reader)
          if(-not $window){throw 'Chinese WPF window did not load'}
          $window.Close()

      - name: Commit final branch state
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item .github/workflows/localization-finalize-once.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PMM Development/Localization .github/workflows/localization-finalize-once.yml
          if(-not (git diff --cached --quiet)){
            git commit -m 'fix: complete Chinese localization coverage for v1.3.4.1'
            git push origin HEAD:1.3.4.1
          }
          $sha=(git rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Package refreshed portable release
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item PMM-1.3.4.1.zip,PMM-1.3.4.1.zip.sha256,PMM-1.3.4.1.validation.json -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path PMM/* -DestinationPath PMM-1.3.4.1.zip -CompressionLevel Optimal
          $hash=(Get-FileHash PMM-1.3.4.1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PMM-1.3.4.1.zip" | Set-Content PMM-1.3.4.1.zip.sha256 -Encoding ascii
          $sha='${{ steps.commit.outputs.sha }}'
          @"
          import json
          from pathlib import Path
          audit=json.loads(Path('Development/Localization/LAST_AUDIT.json').read_text(encoding='utf-8'))
          out={
            'version':'1.3.4.1',
            'release':'Chinese translation',
            'language':'zh-CN',
            'languageName':'简体中文',
            'commit':'$sha',
            'sha256':'$hash',
            'catalogStrings':audit['chineseCatalogStrings'],
            'discoveredUiStrings':audit['discoveredUiStrings'],
            'checks':[
              'canonical English and Simplified Chinese catalogs complete for discovered UI strings',
              'translation placeholders and marker residue validated',
              'all PowerShell modules parsed successfully',
              'all XAML resources parsed successfully',
              'Simplified Chinese WPF MainWindow loaded successfully on Windows',
              'generic catalog lookup and embedded-XAML localization smoke tests passed'
            ]
          }
          Path('PMM-1.3.4.1.validation.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          "@ | python -
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Refresh existing v1.3.4.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $sha='${{ steps.commit.outputs.sha }}'
          git tag -f v1.3.4.1 $sha
          git push origin refs/tags/v1.3.4.1 --force
          @'
          ## v1.3.4.1 Chinese translation — localization refresh

          This is an in-place refresh of the existing **v1.3.4.1** release; no new version was created.

          - Completes **简体中文 (zh-CN)** coverage across the main UI, Mod Creation, shared Research/AI case workspaces, Help, Settings/Installations, dependency status UI, tooltips and dynamic controls.
          - Replaces the language-specific branching with a generic catalog-driven localization layer.
          - Adds canonical `en.json`, `es.json`, `zh-CN.json`, `languages.json`, fallback rules and `ltr`/`rtl` metadata so additional BCP-47 languages can be added without changing application logic.
          - Documents the translation workflow and includes persistent catalog/source validation.
          - Preserves English and Spanish behavior and keeps English as the fallback for a missing translation.

          **中文：** 本次更新完善了简体中文界面，并建立了通用语言目录系统。新增语言只需添加对应 JSON 语言文件并在 `languages.json` 中注册，无需修改界面逻辑。
          '@ | Set-Content release-notes.md -Encoding utf8
          gh release upload v1.3.4.1 PMM-1.3.4.1.zip PMM-1.3.4.1.zip.sha256 PMM-1.3.4.1.validation.json --clobber
          gh release edit v1.3.4.1 --title 'v1.3.4.1 Chinese translation' --notes-file release-notes.md --target $sha --latest
