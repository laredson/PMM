name: Finalize PMM v1.3.4.1 localization v5

on:
  push:
    branches: [1.3.4.1]
    paths: [.github/workflows/localization-finalize-v5-once.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply localization finalizer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python Development/Localization/finalize_v1341_localization.py

      - name: Audit complete localization coverage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python Development/Localization/audit_localization.py
          & ./Development/Localization/Test-Localization.ps1 -Language zh-CN
          $report=Get-Content Development/Localization/LAST_AUDIT.json -Raw -Encoding UTF8|ConvertFrom-Json
          if(@($report.missingEnglish).Count -or @($report.missingChinese).Count -or @($report.placeholderErrors).Count -or @($report.translationResidue).Count -or @($report.clearlyUntranslatedProse).Count -or @($report.wiringErrors).Count -or $report.criticalTranslationErrors.PSObject.Properties.Count){throw 'Localization audit contains unresolved failures.'}
          $legacy=[ordered]@{schema='PMM_LOCALIZATION_MISSING_V2';catalogCount=$report.chineseCatalogStrings;discoveredCount=$report.discoveredUiStrings;relevantCount=$report.relevantUiStrings;missingCount=0;missing=[ordered]@{};note='Generated from LAST_AUDIT.json. No catalog gaps remain.'}
          $legacy|ConvertTo-Json -Depth 8|Set-Content Development/Localization/MISSING_ZH_CN.json -Encoding UTF8
          @('PMM localization audit - v1.3.4.1','',('Discovered UI strings: '+$report.discoveredUiStrings),('Relevant translatable strings: '+$report.relevantUiStrings),('English catalog strings: '+$report.englishCatalogStrings),('Chinese catalog strings: '+$report.chineseCatalogStrings),'','Result: PASS','Missing English: 0','Missing Chinese: 0','Placeholder errors: 0','Translation residue: 0','Clearly untranslated prose: 0','Wiring errors: 0')|Set-Content Development/Localization/UNLOCALIZED_AUDIT.txt -Encoding UTF8

      - name: Parse PowerShell and XAML
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$failed=$false
          Get-ChildItem PMM/Modules,Development/Localization -Recurse -Filter *.ps1|ForEach-Object{$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$failed=$true;$errors|ForEach-Object{Write-Error ($_.Extent.File+': '+$_.Message)}}}
          if($failed){throw 'PowerShell parse validation failed'}
          Get-ChildItem PMM/Resources/UI -Filter *.xaml|ForEach-Object{[xml](Get-Content $_.FullName -Raw -Encoding UTF8)|Out-Null}

      - name: Windows WPF localization smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./Development/Localization/Smoke-Localization.ps1 -Language zh-CN

      - name: Commit final branch state
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @('.github/workflows/localization-finalize-once.yml','.github/workflows/localization-finalize-v2-once.yml','.github/workflows/localization-finalize-v3-once.yml','.github/workflows/localization-finalize-v4-once.yml','.github/workflows/localization-finalize-v5-once.yml','.github/workflows/localization-diagnose-once.yml')|ForEach-Object{Remove-Item $_ -Force -ErrorAction SilentlyContinue}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PMM Development/Localization .github/workflows
          if(-not(git diff --cached --quiet)){git commit -m 'fix: complete catalog-driven localization for v1.3.4.1';git push origin HEAD:1.3.4.1}
          $sha=(git rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Package refreshed portable release
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item PMM-1.3.4.1.zip,PMM-1.3.4.1.zip.sha256,PMM-1.3.4.1.validation.json -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path PMM/* -DestinationPath PMM-1.3.4.1.zip -CompressionLevel Optimal
          $hash=(Get-FileHash PMM-1.3.4.1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PMM-1.3.4.1.zip"|Set-Content PMM-1.3.4.1.zip.sha256 -Encoding ascii
          $audit=Get-Content Development/Localization/LAST_AUDIT.json -Raw -Encoding UTF8|ConvertFrom-Json
          $validation=[ordered]@{version='1.3.4.1';release='Chinese translation / universal localization architecture';language='zh-CN';languageName='简体中文';commit='${{ steps.commit.outputs.sha }}';sha256=$hash;catalogStrings=$audit.chineseCatalogStrings;discoveredUiStrings=$audit.discoveredUiStrings;relevantUiStrings=$audit.relevantUiStrings;checks=@('all discovered relevant UI strings are catalogued','missing Chinese = 0','placeholder/residue/untranslated-prose audit passed','all PowerShell modules parsed','all XAML parsed','Simplified Chinese MainWindow loaded via WPF','static embedded XAML localization passed','dynamic WPF visual-tree and ItemsSource localization passed','language resolver zh-CN passed')}
          $validation|ConvertTo-Json -Depth 8|Set-Content PMM-1.3.4.1.validation.json -Encoding UTF8

      - name: Replace assets in existing v1.3.4.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $sha='${{ steps.commit.outputs.sha }}'
          git tag -f v1.3.4.1 $sha
          git push origin refs/tags/v1.3.4.1 --force
          @('## v1.3.4.1 Chinese translation — complete localization refresh','','This is an in-place refresh of the existing **v1.3.4.1** release; no new version/release was created.','','- Completes **简体中文 (zh-CN)** across the main UI and dynamically generated Mod Creation, Research/AI case, Help, Settings/Installations, dependency/status, tooltip and option controls.','- Fixes the language resolver that could fall back to English for a valid `zh-CN` selection.','- Uses a universal catalog architecture: `en.json` is canonical, each BCP-47 language has one JSON catalog, `languages.json` supplies fallback/direction metadata, and dynamically created WPF controls pass through the same localization layer.','- Adds a language scaffold and persistent audit so future UI strings cannot silently bypass localization.','','**中文：** 本次原位更新完善了简体中文界面，并修复了语言选择回退到英文的问题。现在静态界面和运行时动态创建的界面都使用统一语言目录。新增语言只需添加 BCP-47 JSON 语言文件并在 `languages.json` 中注册，无需增加语言专用程序逻辑。')|Set-Content release-notes.md -Encoding UTF8
          gh release upload v1.3.4.1 PMM-1.3.4.1.zip PMM-1.3.4.1.zip.sha256 PMM-1.3.4.1.validation.json --clobber
          gh release edit v1.3.4.1 --title 'v1.3.4.1 Chinese translation' --notes-file release-notes.md --latest
