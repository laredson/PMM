name: Refresh Desktop CI fixture once

on:
  push:
    branches: [release/1.3.4.1-ci-refresh]
    paths: [.github/workflows/desktop-test-fixture-once.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update synthetic Desktop fixture for explicit modes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='Development/Tests/desktop_binding_regression.ps1'
          $text=[IO.File]::ReadAllText($path,[Text.Encoding]::UTF8)
          $needle="function Get-PMMChatGPTDesktop{if(`$Script:installed){return [pscustomobject]@{InstallLocation='C:\synthetic desktop';SupportsLocalChats=`$true}};return `$null}`r`nfunction Open-PMMDesktopLink"
          $replacement="function Get-PMMChatGPTDesktop{if(`$Script:installed){return [pscustomobject]@{InstallLocation='C:\synthetic desktop';SupportsLocalChats=`$true}};return `$null}`r`n# Synthetic Desktop exposes the same explicit routing modes expected by current PMM.`r`nfunction Get-PMMDesktopModes(`$App){return @('chat','work')}`r`nfunction Open-PMMDesktopLink"
          if(-not $text.Contains($needle)){throw 'Desktop regression fixture marker not found'}
          $text=$text.Replace($needle,$replacement)
          [IO.File]::WriteAllText($path,$text,[Text.UTF8Encoding]::new($true))

      - name: Run Desktop binding regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./Development/Tests/desktop_binding_regression.ps1

      - name: Commit fixture refresh
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item .github/workflows/desktop-test-fixture-once.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align Desktop fixture with explicit mode discovery'
          git push origin HEAD:release/1.3.4.1-ci-refresh
