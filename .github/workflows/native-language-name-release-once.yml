name: PMM v1.3.4.1 native language names

on:
  push:
    branches: [1.3.4.1]
    paths: [.github/workflows/native-language-name-release-once.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Windows PowerShell 5.1 localization regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-ExecutionPolicy -Scope Process Bypass -Force
          if($PSVersionTable.PSVersion.Major -ne 5){throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"}
          & .\Development\Localization\Test-PowerShell51.ps1 -Language zh-CN

      - name: Localization catalog audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python Development/Localization/audit_localization.py
          & ./Development/Localization/Test-Localization.ps1 -Language zh-CN

      - name: Parse shipped PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $failed=$false
          Get-ChildItem PMM/Modules -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){
              $failed=$true
              $errors|ForEach-Object{Write-Error ($_.Extent.File+': '+$_.Message)}
            }
          }
          if($failed){throw 'Windows PowerShell 5.1 parse validation failed'}

      - name: Commit final release state
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item .github/workflows/native-language-name-release-once.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if((git status --porcelain).Length -gt 0){git commit -m 'release: finalize native language-name selector fix'}
          git push origin HEAD:1.3.4.1
          $sha=(git rev-parse HEAD).Trim()
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT,"sha=$sha`n",[Text.Encoding]::UTF8)

      - name: Package corrected v1.3.4.1
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path PMM/* -DestinationPath PMM-1.3.4.1.zip -CompressionLevel Optimal
          $hash=(Get-FileHash PMM-1.3.4.1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PMM-1.3.4.1.zip"|Set-Content PMM-1.3.4.1.zip.sha256 -Encoding ascii
          $audit=Get-Content Development/Localization/LAST_AUDIT.json -Raw|ConvertFrom-Json
          $validation=[ordered]@{
            version='1.3.4.1'
            release='Chinese translation + native language-name selector fix'
            language='zh-CN'
            languageName='简体中文'
            commit='${{ steps.commit.outputs.sha }}'
            sha256=$hash
            catalogStrings=$audit.chineseCatalogStrings
            discoveredUiStrings=$audit.discoveredUiStrings
            nativeLanguageNames=@('English','Español','简体中文')
            checks=@('Windows PowerShell 5.1 localization passed','native language names remain invariant under zh-CN visual-tree localization','normal data-bound labels still localize','localization audit passed','shipped PowerShell parsed under Windows PowerShell 5.1')
          }
          $validation|ConvertTo-Json -Depth 5|Set-Content PMM-1.3.4.1.validation.json -Encoding utf8

      - name: Replace assets in existing v1.3.4.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $sha='${{ steps.commit.outputs.sha }}'
          git tag -f v1.3.4.1 $sha
          git push origin refs/tags/v1.3.4.1 --force
          @'
          ## v1.3.4.1 Chinese translation — native language-name selector fix

          In-place refresh of the existing v1.3.4.1 release.

          - Language selectors now always display each language in its native form: `English`, `Español`, `简体中文`.
          - Native language names come from `languages.json.nativeName` and are explicitly excluded from generic UI translation.
          - Adds a regression test proving that zh-CN localization cannot translate those native names while normal data-bound labels still translate.
          - Keeps the complete BCP-47 localization architecture and Windows PowerShell 5.1 compatibility checks.
          - No new version or release was created.
          '@|Set-Content release-notes.md -Encoding utf8
          gh release upload v1.3.4.1 PMM-1.3.4.1.zip PMM-1.3.4.1.zip.sha256 PMM-1.3.4.1.validation.json --clobber
          gh release edit v1.3.4.1 --title 'v1.3.4.1 Chinese translation' --notes-file release-notes.md --target $sha --latest
