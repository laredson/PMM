name: Finalize Desktop AppX CI fix once

on:
  push:
    branches: [release/1.3.4.1-ci-refresh]
    paths: [.github/workflows/desktop-appx-fix-once.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh package SHA256 inventory
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app=(Resolve-Path PMM).Path
          $sumPath=Join-Path $app 'Resources/Metadata/SHA256SUMS.txt'
          $rows=Get-ChildItem -LiteralPath $app -Recurse -File |
            Where-Object {$_.FullName -ne $sumPath} |
            ForEach-Object {
              $relative=$_.FullName.Substring($app.Length).TrimStart('\','/').Replace('\','/')
              $hash=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            } | Sort-Object {($_ -split '  ',2)[1]}
          [IO.File]::WriteAllLines($sumPath,[string[]]$rows,[Text.UTF8Encoding]::new($false))

      - name: Verify current validator and workspace regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Development/Tests/workspaces_dependencies_regression.ps1 -Language en
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Development/Tests/workspaces_dependencies_regression.ps1 -Language es

      - name: Verify package integrity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./Development/Scripts/validation/Validate-v1.3.ps1 -Quiet

      - name: Commit final state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item .github/workflows/desktop-appx-fix-once.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: finalize Desktop AppX compatibility fix'
          git push origin HEAD:release/1.3.4.1-ci-refresh
