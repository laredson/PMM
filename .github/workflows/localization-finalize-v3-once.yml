name: Finalize PMM v1.3.4.1 localization v3

on:
  push:
    branches: [1.3.4.1]
    paths: [.github/workflows/localization-finalize-v3-once.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix resolver and harden dynamic localization
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import json

          root=Path('PMM')
          loc=root/'Resources/Localization'

          old_resolve="""function Resolve-PMMLanguageCode([string]$Code){
            $registry=Get-PMMLanguageRegistry
            if(-[string]::IsNullOrWhiteSpace($Code)){
              $exact=Get-PMMLanguageDefinition $Code;if($exact){return [string]$exact.code}
              $base=($Code -split '-')[0]
              $match=@($registry.languages|Where-Object{([string]$_.code -split '-')[0] -ieq $base}|Select-Object -First 1)[0]
              if($match){return [string]$match.code}
            }
            return [string]$registry.default
          }"""
          new_resolve="""function Resolve-PMMLanguageCode([string]$Code){
            $registry=Get-PMMLanguageRegistry
            $requested=[string]$Code
            if(-[string]::IsNullOrWhiteSpace($requested)){
              foreach($language in @($registry.languages)){
                if([string]::Equals([string]$language.code,$requested,[StringComparison]::OrdinalIgnoreCase)){return [string]$language.code}
              }
              $base=($requested -split '-')[0]
              foreach($language in @($registry.languages)){
                if([string]::Equals(([string]$language.code -split '-')[0],$base,[StringComparison]::OrdinalIgnoreCase)){return [string]$language.code}
              }
            }
            return [string]$registry.default
          }"""
          for path in [root/'Modules/Shared/Localization.ps1',Path('Development/Localization/build_localization.py')]:
              text=path.read_text(encoding='utf-8-sig')
              if new_resolve not in text:
                  if old_resolve not in text: raise SystemExit(f'Language resolver anchor missing in {path}')
                  text=text.replace(old_resolve,new_resolve,1)
                  path.write_text(text,encoding='utf-8-sig' if path.suffix=='.ps1' else 'utf-8')

          for code, values in {
              'en': {'QUEUED':'QUEUED','RUNNING':'RUNNING','WAITING_EXTERNAL':'WAITING_EXTERNAL','AWAITING_CONSENT':'AWAITING_CONSENT','COMPLETE':'COMPLETE','FAILED':'FAILED','CANCELLED':'CANCELLED'},
              'es': {'QUEUED':'EN COLA','RUNNING':'EN EJECUCIÓN','WAITING_EXTERNAL':'ESPERANDO ACCIÓN EXTERNA','AWAITING_CONSENT':'ESPERANDO CONFIRMACIÓN','COMPLETE':'COMPLETADO','FAILED':'FALLIDO','CANCELLED':'CANCELADO'},
              'zh-CN': {'QUEUED':'排队中','RUNNING':'运行中','WAITING_EXTERNAL':'等待外部操作','AWAITING_CONSENT':'等待确认','COMPLETE':'已完成','FAILED':'失败','CANCELLED':'已取消'}
          }.items():
              path=loc/f'{code}.json';doc=json.loads(path.read_text(encoding='utf-8-sig'));doc['strings'].update(values);doc['strings']=dict(sorted(doc['strings'].items(),key=lambda kv:kv[0].lower()));path.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          zh=json.loads((loc/'zh-CN.json').read_text(encoding='utf-8'))['strings']
          (root/'Resources/UI/strings.zh-CN.json').write_text(json.dumps(zh,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          dep=root/'Modules/Unreal/Dependencies.UI.ps1';text=dep.read_text(encoding='utf-8-sig')
          old="$names=@(Get-PMMDependencyDefinitions|Where-Object{($Job.component -eq 'all' -and $_.id -ne 'chatgpt') -or $_.id -eq $Job.component}|ForEach-Object{$_.name+' '+$_.version})"
          new="$names=@(Get-PMMDependencyDefinitions|Where-Object{($Job.component -eq 'all' -and $_.id -ne 'chatgpt') -or $_.id -eq $Job.component}|ForEach-Object{(Get-PMMLocalizedText ([string]$_.name))+' '+(Get-PMMLocalizedText ([string]$_.version))})"
          if new not in text:
              if old not in text: raise SystemExit('Dependency consent label anchor missing')
              text=text.replace(old,new,1)
          old="$Script:PMMDependencySelectedJob=$job.id;$Script:PMMDependencyStatus.Text=$job.status}catch{Handle-UIError $_ 'Dependencies'}"
          new="$Script:PMMDependencySelectedJob=$job.id;$Script:PMMDependencyStatus.Text=Get-PMMLocalizedText ([string]$job.status)}catch{Handle-UIError $_ 'Dependencies'}"
          if new not in text:
              if old not in text: raise SystemExit('Dependency immediate status anchor missing')
              text=text.replace(old,new,1)
          dep.write_text(text,encoding='utf-8-sig')

          snippet="""    if($Root -is [Windows.Controls.ItemsControl] -and $Root.ItemsSource){foreach($item in @($Root.ItemsSource)){try{if($item -and ($item.PSObject.Properties.Name -contains 'Label') -and $item.Label -is [string]){$item.Label=Get-PMMLocalizedText ([string]$item.Label) $code}}catch{}}}\n"""
          anchor="    if($Root -is [Windows.Controls.DataGrid]){foreach($column in @($Root.Columns)){if($column.Header -is [string]){$column.Header=Get-PMMLocalizedText ([string]$column.Header) $code}}}\n"
          for path in [root/'Modules/Shared/Localization.ps1',Path('Development/Localization/build_localization.py')]:
              text=path.read_text(encoding='utf-8-sig')
              if snippet.strip() not in text:
                  if anchor not in text: raise SystemExit(f'ItemsControl anchor missing in {path}')
                  text=text.replace(anchor,snippet+anchor,1);path.write_text(text,encoding='utf-8-sig' if path.suffix=='.ps1' else 'utf-8')
          '@ | python -

      - name: Audit localization coverage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python Development/Localization/audit_localization.py
          & ./Development/Localization/Test-Localization.ps1 -Language zh-CN

      - name: Parse all PowerShell and XAML
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$failed=$false
          Get-ChildItem PMM/Modules -Recurse -Filter *.ps1 | ForEach-Object {$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$failed=$true;$errors|ForEach-Object{Write-Error ($_.Extent.File+': '+$_.Message)}}}
          if($failed){throw 'PowerShell parse validation failed'}
          Get-ChildItem PMM/Resources/UI -Filter *.xaml | ForEach-Object {[xml](Get-Content $_.FullName -Raw -Encoding UTF8)|Out-Null}

      - name: WPF localization smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName PresentationFramework,PresentationCore,WindowsBase
          $Script:Root=(Resolve-Path 'PMM').Path
          . (Join-Path $Script:Root 'Modules/Shared/Localization.ps1')
          if((Resolve-PMMLanguageCode 'zh-CN') -cne 'zh-CN'){throw 'Language resolver failed'}
          if((Get-PMMLocalizedText 'Projects' 'zh-CN') -cne '项目'){throw 'Chinese catalog lookup failed'}
          if((Get-PMMLocalizedText 'Installations and status' 'zh-CN') -cne '安装与状态'){throw 'Installations lookup failed'}
          $probe='<StackPanel xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"><TextBlock Text="Projects"/><Button Content="New case"/></StackPanel>'
          $localized=Convert-PMMXamlLocalization $probe 'zh-CN';if($localized -notmatch '项目'){throw 'Embedded XAML localization failed'}
          [xml]$xml=Get-Content PMM/Resources/UI/MainWindow.zh-CN.xaml -Raw -Encoding UTF8;$reader=[System.Xml.XmlNodeReader]::new($xml);$window=[Windows.Markup.XamlReader]::Load($reader);if(-not $window){throw 'Chinese WPF window did not load'};$window.Close()

      - name: Commit final branch state
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @('.github/workflows/localization-finalize-once.yml','.github/workflows/localization-finalize-v2-once.yml','.github/workflows/localization-finalize-v3-once.yml','.github/workflows/localization-diagnose-once.yml')|ForEach-Object{Remove-Item $_ -Force -ErrorAction SilentlyContinue}
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PMM Development/Localization .github/workflows
          if(-not(git diff --cached --quiet)){git commit -m 'fix: complete Chinese localization coverage for v1.3.4.1';git push origin HEAD:1.3.4.1}
          $sha=(git rev-parse HEAD).Trim();"sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Package refreshed portable release
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item PMM-1.3.4.1.zip,PMM-1.3.4.1.zip.sha256,PMM-1.3.4.1.validation.json -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path PMM/* -DestinationPath PMM-1.3.4.1.zip -CompressionLevel Optimal
          $hash=(Get-FileHash PMM-1.3.4.1.zip -Algorithm SHA256).Hash.ToLowerInvariant();"$hash  PMM-1.3.4.1.zip"|Set-Content PMM-1.3.4.1.zip.sha256 -Encoding ascii
          $sha='${{ steps.commit.outputs.sha }}'
          @"
          import json
          from pathlib import Path
          audit=json.loads(Path('Development/Localization/LAST_AUDIT.json').read_text(encoding='utf-8'))
          out={'version':'1.3.4.1','release':'Chinese translation','language':'zh-CN','languageName':'简体中文','commit':'$sha','sha256':'$hash','catalogStrings':audit['chineseCatalogStrings'],'discoveredUiStrings':audit['discoveredUiStrings'],'checks':['source/catalog coverage audit passed','placeholder and residue validation passed','all PowerShell modules parsed','all XAML parsed','Simplified Chinese MainWindow loaded via WPF on Windows','generic catalog and embedded-XAML localization smoke passed']}
          Path('PMM-1.3.4.1.validation.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          "@|python -
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Refresh existing v1.3.4.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$sha='${{ steps.commit.outputs.sha }}'
          git tag -f v1.3.4.1 $sha;git push origin refs/tags/v1.3.4.1 --force
          @'
          ## v1.3.4.1 Chinese translation — localization refresh

          In-place refresh of the existing **v1.3.4.1** release; no new version was created.

          - Completes **简体中文 (zh-CN)** coverage across the main UI, Mod Creation, Research/AI case workspaces, Help, Settings/Installations, dependency/status UI, tooltips and dynamic controls.
          - Uses a generic catalog-driven localization layer with canonical `en.json`, `es.json`, `zh-CN.json`, `languages.json`, fallback rules and `ltr`/`rtl` metadata.
          - Additional BCP-47 languages can be added as data without adding language-specific application branches.
          - Includes documented translation workflow plus persistent source/catalog validation.

          **中文：** 本次更新完善了简体中文界面，并建立了通用语言目录系统。新增语言只需添加对应 JSON 语言文件并在 `languages.json` 中注册，无需修改界面逻辑。
          '@|Set-Content release-notes.md -Encoding utf8
          gh release upload v1.3.4.1 PMM-1.3.4.1.zip PMM-1.3.4.1.zip.sha256 PMM-1.3.4.1.validation.json --clobber
          gh release edit v1.3.4.1 --title 'v1.3.4.1 Chinese translation' --notes-file release-notes.md --target $sha --latest
