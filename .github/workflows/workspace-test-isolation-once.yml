name: Isolate workspace CI fixture once

on:
  push:
    branches: [release/1.3.4.1-ci-refresh]
    paths: [.github/workflows/workspace-test-isolation-once.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Isolate workspace regression from runner AppX inventory
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='Development/Tests/workspaces_dependencies_regression.ps1'
          $text=[IO.File]::ReadAllText($path,[Text.Encoding]::UTF8)
          $needle=". (Join-Path `$Script:Root 'Modules\AIIO\AIIO.Workspaces.UI.ps1')`r`ntry{"
          $replacement=". (Join-Path `$Script:Root 'Modules\AIIO\AIIO.Workspaces.UI.ps1')`r`n# This regression validates PMM workspace/dependency behavior, not the runner's installed AppX inventory.`r`n# Keep Desktop package discovery deterministic so hosted-runner software cannot change the result.`r`nfunction Get-PMMDesktopPackages { return @() }`r`ntry{"
          if(-not $text.Contains($needle)){throw 'Workspace regression insertion marker not found'}
          $text=$text.Replace($needle,$replacement)
          [IO.File]::WriteAllText($path,$text,[Text.UTF8Encoding]::new($false))

      - name: Run workspace regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./Development/Tests/workspaces_dependencies_regression.ps1 -Language en
          ./Development/Tests/workspaces_dependencies_regression.ps1 -Language es

      - name: Commit isolated fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item .github/workflows/workspace-test-isolation-once.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: isolate workspace regression from runner AppX inventory'
          git push origin HEAD:release/1.3.4.1-ci-refresh
