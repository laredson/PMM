# Rerun with the current Desktop-options extension loaded like production.
name: Isolate workspace CI fixture once

on:
  push:
    branches: [release/1.3.4.1-ci-refresh]
    paths: [.github/workflows/workspace-test-isolation-once.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh workspace regression fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='Development/Tests/workspaces_dependencies_regression.ps1'
          $text=[IO.File]::ReadAllText($path,[Text.Encoding]::UTF8)
          $pattern="(?m)^\. \(Join-Path \`$Script:Root 'Modules\\AIIO\\AIIO\.Workspaces\.UI\.ps1'\)\r?$"
          $match=[regex]::Match($text,$pattern)
          if(-not $match.Success){throw 'Workspace regression insertion marker not found'}
          $insertion=$match.Value+"`n# Load the current Desktop-options extension that production loads through the UI module registry.`n. (Join-Path `$Script:Root 'Modules\Presentation\Desktop.Options.UI.ps1')`n# This regression validates PMM workspace/dependency behavior, not the runner's installed AppX inventory.`n# Keep Desktop package discovery deterministic so hosted-runner software cannot change the result.`nfunction Get-PMMDesktopPackages { return @() }"
          $text=[regex]::Replace($text,$pattern,[Text.RegularExpressions.MatchEvaluator]{param($m)$insertion},1)
          [IO.File]::WriteAllText($path,$text,[Text.UTF8Encoding]::new($false))

      - name: Run workspace regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./Development/Tests/workspaces_dependencies_regression.ps1 -Language en
          ./Development/Tests/workspaces_dependencies_regression.ps1 -Language es

      - name: Commit refreshed fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item .github/workflows/workspace-test-isolation-once.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align workspace regression with current UI extensions'
          git push origin HEAD:release/1.3.4.1-ci-refresh
