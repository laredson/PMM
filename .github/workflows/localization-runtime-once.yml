name: PMM localization runtime once

on:
  push:
    branches:
      - 1.3.4.1
    paths:
      - .github/workflows/localization-runtime-once.yml

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install offline translation engine
        shell: bash
        run: python3 -m pip install --quiet argostranslate

      - name: Add exact file-filter translation to build tool
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Development/Localization/build_localization.py')
          t=p.read_text(encoding='utf-8')
          key='PMM manual/AI solution (*.zip)|*.zip|All files (*.*)|*.*'
          if key not in t:
              anchor='        "PMM": "PMM",\n'
              replacement=anchor+'        "PMM manual/AI solution (*.zip)|*.zip|All files (*.*)|*.*": "PMM 手动/AI 解决方案 (*.zip)|*.zip|所有文件 (*.*)|*.*",\n'
              if anchor not in t: raise SystemExit('Curated map anchor not found')
              t=t.replace(anchor,replacement,1)
              p.write_text(t,encoding='utf-8')
          PY

      - name: Build localization runtime and catalogs
        shell: bash
        run: python3 Development/Localization/build_localization.py

      - name: Validate PowerShell, XAML and Chinese catalog
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./Development/Localization/Test-Localization.ps1 -Language zh-CN
          $files=@(
            'PMM/Modules/Shared/Localization.ps1',
            'PMM/Modules/Shared/Common.ps1',
            'PMM/Modules/Bootstrap/Start-PalModMerger.ps1',
            'PMM/Modules/AIIO/AIIO.CaseWorkspace.UI.ps1',
            'PMM/Modules/AIIO/AIIO.CaseNavigation.UI.ps1',
            'PMM/Modules/AIIO/AIIO.Workspaces.UI.ps1',
            'PMM/Modules/Shared/Settings.Workspaces.UI.ps1',
            'PMM/Modules/Unreal/Dependencies.UI.ps1'
          )
          foreach($f in $files){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ($f+': '+$_.Message)};throw 'PowerShell parse failure'}
          }
          [xml](Get-Content PMM/Resources/UI/MainWindow.en.xaml -Raw -Encoding UTF8)|Out-Null
          [xml](Get-Content PMM/Resources/UI/MainWindow.es.xaml -Raw -Encoding UTF8)|Out-Null
          [xml](Get-Content PMM/Resources/UI/MainWindow.zh-CN.xaml -Raw -Encoding UTF8)|Out-Null

      - name: Commit localization runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/localization-runtime-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PMM Development/Localization .github/workflows/localization-runtime-once.yml
          git commit -m 'feat: complete generic localization runtime for v1.3.4.1'
          git push origin HEAD:1.3.4.1
