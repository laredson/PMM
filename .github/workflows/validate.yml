name: PMM validation

on:
  push:
    branches:
      - main
      - '1.3.0final'
      - '1.3.1-*'
      - 'dev/**'
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Validate repository and PMM package contract
        shell: pwsh
        run: |
          ./Development/Scripts/validation/Validate-v1.3.ps1 -Quiet

      - name: Materialize WPF window and AUTO template
        shell: powershell
        run: |
          ./Development/Tests/wpf_xaml_runtime_regression.ps1

      - name: Run RC21 static smoke contract
        shell: pwsh
        run: |
          ./Development/Tests/SmokeTest.ps1

      - name: Compile-test PMM Host source snapshot
        shell: pwsh
        working-directory: Development/Source/Host
        run: |
          go test ./...

      - name: Test PMM Runtime source snapshot
        shell: pwsh
        working-directory: Development/Source/Runtime
        run: |
          go test ./...

      - name: Native Runtime self-test (packaged Guided Flow binary)
        shell: pwsh
        run: |
          ./PMM/Engine/PMMRuntime.exe self-test

      - name: Host to Runtime native-route self-test (packaged Guided Flow binary)
        shell: pwsh
        run: |
          ./PMM/PMM.exe runtime-self-test

      - name: Desktop binding, background snapshots and independent cases
        shell: powershell
        run: |
          ./Development/Tests/desktop_binding_regression.ps1
          ./Development/Tests/desktop_snapshot_regression.ps1
          ./Development/Tests/workspaces_dependencies_regression.ps1 -Language en
          ./Development/Tests/workspaces_dependencies_regression.ps1 -Language es

      - name: Play Create contracts, recovery and local knowledge (Windows PowerShell 5.1)
        shell: powershell
        run: |
          ./Development/Tests/architecture_contract_regression.ps1
          ./Development/Tests/cases_v4_regression.ps1
          ./Development/Tests/module_runtime_regression.ps1
          ./Development/Tests/persistence_recovery_regression.ps1
          ./Development/Tests/play_create_knowledge_regression.ps1
          ./Development/Tests/play_create_tools_regression.ps1
          ./Development/Tests/play_create_trial_regression.ps1
          ./Development/Tests/workbench_actions_regression.ps1
          ./Development/Tests/workbench_ui_regression.ps1 -Language en
          ./Development/Tests/workbench_ui_regression.ps1 -Language es
          ./Development/Tests/full_bootstrap_smoke.ps1