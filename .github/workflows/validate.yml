# Current-release CI: version-aware package integrity, localization, Windows PowerShell 5.1, WPF and runtime checks.
name: PMM validation

on:
  push:
    branches:
      - main
      - '1.3.0final'
      - '1.3.1-*'
      - 'dev/**'
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Validate current repository and PMM package contract
        shell: pwsh
        run: |
          ./Development/Scripts/validation/Validate-v1.3.ps1 -Quiet

      - name: Windows PowerShell 5.1 localization regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-ExecutionPolicy -Scope Process Bypass -Force
          if($PSVersionTable.PSVersion.Major -ne 5){throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"}
          ./Development/Localization/Test-PowerShell51.ps1 -Language zh-CN

      - name: Localization catalog audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python Development/Localization/audit_localization.py
          ./Development/Localization/Test-Localization.ps1 -Language zh-CN

      - name: Parse shipped PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $failed=$false
          Get-ChildItem PMM/Modules -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){
              $failed=$true
              $errors|ForEach-Object{Write-Error ($_.Extent.File+': '+$_.Message)}
            }
          }
          if($failed){throw 'Windows PowerShell 5.1 parse validation failed'}

      - name: Materialize WPF window and AUTO template
        shell: powershell
        run: |
          ./Development/Tests/wpf_xaml_runtime_regression.ps1

      - name: Compile-test PMM Host source snapshot
        shell: pwsh
        working-directory: Development/Source/Host
        run: |
          go test ./...

      - name: Test PMM Runtime source snapshot
        shell: pwsh
        working-directory: Development/Source/Runtime
        run: |
          go test ./...

      - name: Native Runtime self-test
        shell: pwsh
        run: |
          ./PMM/Engine/PMMRuntime.exe self-test

      - name: Host to Runtime native-route self-test
        shell: pwsh
        run: |
          ./PMM/PMM.exe runtime-self-test

      - name: Desktop binding, background snapshots and independent cases
        shell: powershell
        run: |
          ./Development/Tests/desktop_binding_regression.ps1
          ./Development/Tests/desktop_snapshot_regression.ps1
          ./Development/Tests/workspaces_dependencies_regression.ps1 -Language en
          ./Development/Tests/workspaces_dependencies_regression.ps1 -Language es
          ./Development/Tests/workspaces_dependencies_regression.ps1 -Language zh-CN
