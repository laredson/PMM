name: PMM validation

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Validate PMM 1.2 repository and package contract
        shell: pwsh
        run: |
          ./Validation/Validate-v1.2.ps1 -Quiet

      - name: Compile-test PMM Host source
        shell: pwsh
        working-directory: Host
        run: |
          go test ./...

      - name: Test PMM Runtime source
        shell: pwsh
        working-directory: Runtime
        run: |
          go test ./...

      - name: Native Runtime self-test
        shell: pwsh
        run: |
          ./PMMRuntime.exe self-test

      - name: Host to Runtime native-route self-test
        shell: pwsh
        run: |
          ./PMM.exe runtime-self-test
